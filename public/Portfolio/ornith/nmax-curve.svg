<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="720" height="440" rx="14" fill="#0f172a"/>
  <text x="40" y="42" fill="#e2e8f0" font-size="20" font-weight="700">DFlash n_max sweep — coding decode throughput</text>
  <text x="40" y="64" fill="#94a3b8" font-size="13">Ornith-397B (IQ2_KS) on DGX Spark · greedy · 8 prompts × 2 reps · measured 2026-07-05</text>

  <!-- gridlines + y ticks (tok/s) -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="80" y1="95.6" x2="680" y2="95.6"/>
    <line x1="80" y1="166.7" x2="680" y2="166.7"/>
    <line x1="80" y1="237.8" x2="680" y2="237.8"/>
    <line x1="80" y1="308.9" x2="680" y2="308.9"/>
  </g>
  <g fill="#64748b" font-size="12" text-anchor="end">
    <text x="70" y="99.6">24</text>
    <text x="70" y="170.7">18</text>
    <text x="70" y="241.8">12</text>
    <text x="70" y="312.9">6</text>
  </g>
  <text x="26" y="220" fill="#94a3b8" font-size="13" transform="rotate(-90 26 220)" text-anchor="middle">tok/s</text>

  <!-- axes -->
  <line x1="80" y1="60" x2="80" y2="380" stroke="#334155" stroke-width="1.5"/>
  <line x1="80" y1="380" x2="680" y2="380" stroke="#334155" stroke-width="1.5"/>

  <!-- pure-target baseline (spec off, 18.5 tok/s) -->
  <line x1="80" y1="160.5" x2="680" y2="160.5" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.85"/>
  <text x="672" y="153" fill="#f59e0b" font-size="12" text-anchor="end">pure-target 18.5</text>

  <!-- curve -->
  <polyline points="80,160.5 130,128.0 180,92.5 230,92.8 280,122.5 380,169.7 480,213.6 680,240.6"
            fill="none" stroke="#a855f7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#c084fc">
    <circle cx="80" cy="160.5" r="4"/><circle cx="130" cy="128.0" r="4"/>
    <circle cx="230" cy="92.8" r="4"/><circle cx="280" cy="122.5" r="4"/>
    <circle cx="380" cy="169.7" r="4"/><circle cx="480" cy="213.6" r="4"/>
    <circle cx="680" cy="240.6" r="4"/>
  </g>
  <!-- peak marker -->
  <circle cx="180" cy="92.5" r="6.5" fill="#a855f7" stroke="#e9d5ff" stroke-width="2"/>
  <rect x="196" y="70" width="196" height="40" rx="7" fill="#7c3aed"/>
  <text x="208" y="87" fill="#faf5ff" font-size="14" font-weight="700">24.3 tok/s · n_max=2</text>
  <text x="208" y="103" fill="#e9d5ff" font-size="12">+31% vs pure · +79% vs old prod</text>

  <!-- x ticks (n_max) -->
  <g fill="#64748b" font-size="12" text-anchor="middle">
    <text x="80" y="400">0</text><text x="130" y="400">1</text><text x="180" y="400">2</text>
    <text x="230" y="400">3</text><text x="280" y="400">4</text><text x="380" y="400">6</text>
    <text x="480" y="400">8</text><text x="680" y="400">12</text>
  </g>
  <text x="380" y="426" fill="#94a3b8" font-size="13" text-anchor="middle">draft tokens per step (n_max) — accepted value falls below cost past ~2–3 on a sparse-MoE target</text>
</svg>
