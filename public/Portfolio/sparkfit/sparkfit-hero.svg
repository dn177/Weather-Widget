<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" role="img" aria-label="Root-causing a silent 2-bit quantization bug on a 397B MoE: the recipe was built to 0.24% of its predicted size, then five controlled experiments eliminated the kernel, the quant types, the imatrix and the source until a clean 1B control isolated the fault to the toolchain's requant path — recipe cleared, production never touched">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12021f"/>
      <stop offset="1" stop-color="#2a0648"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcbf88"/>
      <stop offset="1" stop-color="#b08c4e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cba4ff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#cba4ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="plate"><rect width="720" height="440" rx="14"/></clipPath>
  </defs>

  <rect width="720" height="440" rx="14" fill="url(#bg)"/>
  <rect x="0" y="0" width="6" height="440" fill="url(#rail)" clip-path="url(#plate)"/>
  <ellipse cx="150" cy="300" rx="180" ry="120" fill="url(#glow)"/>

  <!-- header: this is a DEBUGGING story, framed as one from the first glance -->
  <text x="44" y="54" fill="#c8ac72" font-size="12.5" font-weight="700" letter-spacing="2.4">SELF-HOSTED LLM &#183; ROOT-CAUSE INVESTIGATION</text>
  <text x="42" y="94" fill="#fdf6ea" font-size="31" font-weight="700" font-family="Georgia,'Times New Roman',ui-serif,serif">Root-causing a silent</text>
  <text x="42" y="128" fill="#fdf6ea" font-size="31" font-weight="700" font-family="Georgia,'Times New Roman',ui-serif,serif">2-bit quantization bug</text>
  <text x="44" y="154" fill="#a493a2" font-size="13" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Custom 397B-MoE cut &#183; every static check green, the output still broke &#183; DGX Spark GB10</text>

  <!-- divider -->
  <rect x="44" y="174" width="632" height="1" fill="#c9a96e" opacity="0.18"/>
  <rect x="44" y="173" width="32" height="2" fill="#c9a96e" opacity="0.9"/>

  <!-- LEFT: the design was sound (the thing the investigation cleared) -->
  <text x="45" y="204" fill="#c8ac72" font-size="11" font-weight="700" letter-spacing="1.8">THE RECIPE WAS SOUND</text>
  <text x="41" y="266" fill="#cba4ff" font-size="54" font-weight="800" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">0.24%</text>
  <text x="45" y="292" fill="#f4ead9" font-size="13.5" font-weight="600">106.83 GB predicted &#8594; 106.57 built</text>
  <text x="45" y="312" fill="#b9a7b7" font-size="12">one recipe line changed vs the baseline</text>
  <text x="45" y="330" fill="#b9a7b7" font-size="12">priced by &#916;-bpw math before any compute</text>
  <text x="45" y="348" fill="#b9a7b7" font-size="12">37-min build &#183; 16 ARM threads</text>

  <!-- RIGHT: the process — how the fault was isolated, one variable per run -->
  <rect x="368" y="188" width="308" height="184" rx="10" fill="#1b0733" stroke="#c9a96e" stroke-opacity="0.16"/>
  <text x="384" y="211" fill="#c8ac72" font-size="10.5" font-weight="700" letter-spacing="1.1">HOW THE FAULT WAS ISOLATED</text>
  <text x="384" y="227" fill="#8d7f88" font-size="9.5">one variable changed per experiment</text>

  <text x="384" y="252" fill="#9a86a6" font-size="11" font-weight="700">&#10007;</text>
  <text x="399" y="252" fill="#a493a2" font-size="11.5">CUDA kernel</text>
  <text x="660" y="252" fill="#d9c9b0" font-size="11" text-anchor="end">same on CPU</text>

  <text x="384" y="276" fill="#9a86a6" font-size="11" font-weight="700">&#10007;</text>
  <text x="399" y="276" fill="#a493a2" font-size="11.5">Quant type</text>
  <text x="660" y="276" fill="#d9c9b0" font-size="11" text-anchor="end">IQ2_K, IQ2_KT alike</text>

  <text x="384" y="300" fill="#9a86a6" font-size="11" font-weight="700">&#10007;</text>
  <text x="399" y="300" fill="#a493a2" font-size="11.5">Importance matrix</text>
  <text x="660" y="300" fill="#d9c9b0" font-size="11" text-anchor="end">same with none</text>

  <text x="384" y="324" fill="#9a86a6" font-size="11" font-weight="700">&#10007;</text>
  <text x="399" y="324" fill="#a493a2" font-size="11.5">Source model</text>
  <text x="660" y="324" fill="#d9c9b0" font-size="11" text-anchor="end">same, 2nd source</text>

  <rect x="378" y="334" width="288" height="21" rx="5" fill="#7ee2a8" opacity="0.11"/>
  <text x="384" y="349" fill="#7ee2a8" font-size="11" font-weight="700">&#10003;</text>
  <text x="399" y="349" fill="#eafff3" font-size="11.5" font-weight="700">1B dense control</text>
  <text x="660" y="349" fill="#a9f0c8" font-size="11" font-weight="700" text-anchor="end">CLEAN</text>

  <text x="384" y="368" fill="#dcbf88" font-size="11" font-weight="600">&#8594; fault is the toolchain requant path</text>

  <!-- bottom: the repeatable method + the operational win -->
  <rect x="44" y="382" width="632" height="1" fill="#c9a96e" opacity="0.14"/>
  <text x="676" y="400" fill="#7ee2a8" font-size="10.5" font-weight="700" letter-spacing="1.1" text-anchor="end">PRODUCTION NEVER TOUCHED</text>
  <text x="44" y="400" fill="#c8ac72" font-size="10.5" font-weight="700" letter-spacing="1.4">THE METHOD</text>
  <text x="44" y="424" font-size="11.5" font-weight="600" letter-spacing="0.3">
    <tspan fill="#dcbf88">1</tspan><tspan fill="#c9b7c6">&#160;price on paper</tspan><tspan fill="#6d6076">&#160;&#8594;&#160;</tspan><tspan fill="#dcbf88">2</tspan><tspan fill="#c9b7c6">&#160;gate ladder</tspan><tspan fill="#6d6076">&#160;&#8594;&#160;</tspan><tspan fill="#dcbf88">3</tspan><tspan fill="#c9b7c6">&#160;bisect on failure</tspan>
  </text>
</svg>
