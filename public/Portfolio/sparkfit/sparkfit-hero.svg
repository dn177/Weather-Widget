<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" role="img" aria-label="Designing a custom 2-bit cut of a 397B MoE to a 121 GiB memory budget: predicted vs built size within 0.24%, the four design moves — read the budget, retune one tensor class, price it on paper, build it — and the reusable price then gate-ladder method, with production never disrupted">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12021f"/>
      <stop offset="1" stop-color="#2a0648"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcbf88"/>
      <stop offset="1" stop-color="#b08c4e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cba4ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#cba4ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="plate"><rect width="720" height="440" rx="14"/></clipPath>
  </defs>

  <rect width="720" height="440" rx="14" fill="url(#bg)"/>
  <rect x="0" y="0" width="6" height="440" fill="url(#rail)" clip-path="url(#plate)"/>
  <ellipse cx="150" cy="296" rx="180" ry="120" fill="url(#glow)"/>

  <!-- header -->
  <text x="44" y="54" fill="#c8ac72" font-size="12.5" font-weight="700" letter-spacing="2.4">SELF-HOSTED LLM &#183; CUSTOM QUANTIZATION</text>
  <text x="42" y="94" fill="#fdf6ea" font-size="32" font-weight="700" font-family="Georgia,'Times New Roman',ui-serif,serif">Designing a 397B MoE cut</text>
  <text x="42" y="128" fill="#fdf6ea" font-size="32" font-weight="700" font-family="Georgia,'Times New Roman',ui-serif,serif">to a 121 GiB budget</text>
  <text x="44" y="154" fill="#a493a2" font-size="13" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">A custom 2-bit cut, sized by &#916;-bpw arithmetic before any compute &#183; DGX Spark GB10</text>

  <!-- divider -->
  <rect x="44" y="174" width="632" height="1" fill="#c9a96e" opacity="0.18"/>
  <rect x="44" y="173" width="32" height="2" fill="#c9a96e" opacity="0.9"/>

  <!-- LEFT: the payoff — predicted size vs built -->
  <text x="45" y="206" fill="#c8ac72" font-size="11" font-weight="700" letter-spacing="1.8">PREDICTED VS BUILT</text>
  <text x="41" y="274" fill="#cba4ff" font-size="60" font-weight="800" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">0.24%</text>
  <text x="45" y="300" fill="#f4ead9" font-size="14" font-weight="600">106.83 GB predicted &#8594; 106.57 built</text>
  <text x="45" y="321" fill="#b9a7b7" font-size="12.5">37-min build &#183; 16 ARM threads</text>
  <text x="45" y="340" fill="#b9a7b7" font-size="12.5">one tensor class changed vs the baseline</text>

  <!-- RIGHT: the design, in four moves (the steps) -->
  <rect x="368" y="188" width="308" height="168" rx="10" fill="#1b0733" stroke="#c9a96e" stroke-opacity="0.16"/>
  <text x="384" y="211" fill="#c8ac72" font-size="10.5" font-weight="700" letter-spacing="1.1">THE DESIGN, IN FOUR MOVES</text>

  <text x="384" y="244" fill="#dcbf88" font-size="12.5" font-weight="800">1</text>
  <text x="401" y="244" fill="#ece2f2" font-size="11">Read the budget</text>
  <text x="660" y="244" fill="#d9c9b0" font-size="10.5" text-anchor="end">98 of 121 GiB used</text>

  <text x="384" y="276" fill="#dcbf88" font-size="12.5" font-weight="800">2</text>
  <text x="401" y="276" fill="#ece2f2" font-size="11">Retune one class</text>
  <text x="660" y="276" fill="#d9c9b0" font-size="10.5" text-anchor="end">2.125 &#8594; 2.6875 bpw</text>

  <text x="384" y="308" fill="#dcbf88" font-size="12.5" font-weight="800">3</text>
  <text x="401" y="308" fill="#ece2f2" font-size="11">Price it on paper</text>
  <text x="660" y="308" fill="#d9c9b0" font-size="10.5" text-anchor="end">&#8594; 106.8 GB</text>

  <rect x="378" y="322" width="288" height="22" rx="5" fill="#7ee2a8" opacity="0.10"/>
  <text x="384" y="338" fill="#7ee2a8" font-size="12.5" font-weight="800">4</text>
  <text x="401" y="338" fill="#eafff3" font-size="11" font-weight="600">Build it</text>
  <text x="660" y="338" fill="#a9f0c8" font-size="10.5" font-weight="700" text-anchor="end">within &#177;3%, first try</text>

  <!-- bottom: the reusable method + operational win -->
  <rect x="44" y="380" width="632" height="1" fill="#c9a96e" opacity="0.14"/>
  <text x="44" y="405" fill="#c8ac72" font-size="10.5" font-weight="700" letter-spacing="1.2">METHOD &#183; PRICE &#8594; GATE LADDER &#183; CHEAP TO EXPENSIVE</text>
  <text x="676" y="405" fill="#7ee2a8" font-size="10.5" font-weight="700" letter-spacing="1.1" text-anchor="end">PRODUCTION NEVER DISRUPTED</text>
  <text x="44" y="426" fill="#8d7f88" font-size="11">predict before you build &#183; change one variable &#183; verify the size gate</text>
</svg>
