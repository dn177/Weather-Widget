<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" role="img" aria-label="Quantizing a 397B MoE into a 121 GiB budget: built to 0.24% of the paper-predicted size, failed the first semantic gate, fault isolated to the toolchain by a five-experiment falsification chain">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12021f"/>
      <stop offset="1" stop-color="#2a0648"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcbf88"/>
      <stop offset="1" stop-color="#b08c4e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cba4ff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#cba4ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="plate"><rect width="720" height="440" rx="14"/></clipPath>
  </defs>

  <rect width="720" height="440" rx="14" fill="url(#bg)"/>
  <rect x="0" y="0" width="6" height="440" fill="url(#rail)" clip-path="url(#plate)"/>
  <ellipse cx="150" cy="280" rx="180" ry="110" fill="url(#glow)"/>

  <!-- header -->
  <text x="44" y="58" fill="#c8ac72" font-size="12.5" font-weight="700" letter-spacing="2.4">SELF-HOSTED LLM &#183; CUSTOM QUANTIZATION</text>
  <text x="42" y="102" fill="#fdf6ea" font-size="33" font-weight="700" font-family="Georgia,'Times New Roman',ui-serif,serif">Quantizing a 397B MoE</text>
  <text x="42" y="140" fill="#fdf6ea" font-size="33" font-weight="700" font-family="Georgia,'Times New Roman',ui-serif,serif">into a 121 GiB budget</text>
  <text x="44" y="168" fill="#a493a2" font-size="13.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">SPARKFIT cut &#183; one recipe line changed vs the served baseline &#183; DGX Spark GB10</text>

  <!-- divider -->
  <rect x="44" y="190" width="632" height="1" fill="#c9a96e" opacity="0.18"/>
  <rect x="44" y="189" width="32" height="2" fill="#c9a96e" opacity="0.9"/>

  <!-- LEFT: prediction stat, kept quiet -->
  <text x="45" y="226" fill="#c8ac72" font-size="11.5" font-weight="700" letter-spacing="2">PREDICTED VS BUILT</text>
  <text x="41" y="294" fill="#cba4ff" font-size="62" font-weight="800" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">0.24%</text>
  <text x="45" y="322" fill="#f4ead9" font-size="15" font-weight="600">106.83 GB on paper &#8594; 106.57 GB built</text>
  <text x="45" y="344" fill="#b9a7b7" font-size="12.5">sized by &#916;-bpw arithmetic before any compute</text>
  <text x="45" y="362" fill="#b9a7b7" font-size="12.5">37 min build &#183; 16 ARM threads</text>

  <!-- RIGHT: gate ladder, resolved -->
  <rect x="368" y="206" width="308" height="166" rx="10" fill="#1b0733" stroke="#c9a96e" stroke-opacity="0.16"/>
  <text x="384" y="229" fill="#c8ac72" font-size="10.5" font-weight="700" letter-spacing="1.2">GATE LADDER &#183; CHEAP &#8594; EXPENSIVE</text>

  <circle cx="389" cy="248" r="3.4" fill="#7ee2a8"/>
  <text x="400" y="252" fill="#e9ddf2" font-size="11.5">G0 preflight: disk / claim / memory</text>
  <text x="660" y="252" fill="#7ee2a8" font-size="11.5" font-weight="700" text-anchor="end">PASS</text>

  <circle cx="389" cy="269" r="3.4" fill="#7ee2a8"/>
  <text x="400" y="273" fill="#e9ddf2" font-size="11.5">G1 compat + imatrix coverage</text>
  <text x="660" y="273" fill="#7ee2a8" font-size="11.5" font-weight="700" text-anchor="end">PASS</text>

  <circle cx="389" cy="290" r="3.4" fill="#7ee2a8"/>
  <text x="400" y="294" fill="#e9ddf2" font-size="11.5">G2 size within &#177;3% of paper</text>
  <text x="660" y="294" fill="#7ee2a8" font-size="11.5" font-weight="700" text-anchor="end">PASS</text>

  <rect x="378" y="301" width="288" height="20" rx="5" fill="#ff7a6e" opacity="0.10"/>
  <circle cx="389" cy="311" r="3.8" fill="#ff7a6e"/>
  <text x="400" y="315" fill="#ffd9d4" font-size="11.5" font-weight="700">G3 first token &#8212; the semantic gate</text>
  <text x="660" y="315" fill="#ff7a6e" font-size="11.5" font-weight="800" text-anchor="end">FAIL</text>

  <circle cx="389" cy="332" r="3.4" fill="none" stroke="#776a80" stroke-width="1.2"/>
  <text x="400" y="336" fill="#776a80" font-size="11.5">G4 memory at serving config</text>
  <text x="660" y="336" fill="#776a80" font-size="11.5" text-anchor="end">not reached</text>

  <circle cx="389" cy="353" r="3.4" fill="none" stroke="#776a80" stroke-width="1.2"/>
  <text x="400" y="357" fill="#776a80" font-size="11.5">G5 quality suite A/B</text>
  <text x="660" y="357" fill="#776a80" font-size="11.5" text-anchor="end">not reached</text>

  <!-- BOTTOM: the falsification chain (signature) -->
  <rect x="44" y="382" width="632" height="1" fill="#c9a96e" opacity="0.14"/>
  <text x="44" y="401" fill="#c8ac72" font-size="10.5" font-weight="700" letter-spacing="1.4">FALSIFICATION CHAIN &#183; ONE VARIABLE PER EXPERIMENT</text>
  <text x="676" y="401" fill="#dcbf88" font-size="10.5" font-weight="700" letter-spacing="1.2" text-anchor="end">VERDICT: TOOLCHAIN, NOT RECIPE</text>

  <line x1="52" y1="422" x2="500" y2="422" stroke="#9a86a6" stroke-opacity="0.25"/>

  <rect x="44" y="410" width="76" height="24" rx="12" fill="#12021f" stroke="#ff7a6e" stroke-opacity="0.55"/>
  <text x="82" y="426" fill="#ffb4ab" font-size="11" font-weight="600" text-anchor="middle">IQ2_KL &#10007;</text>

  <rect x="130" y="410" width="70" height="24" rx="12" fill="#12021f" stroke="#ff7a6e" stroke-opacity="0.55"/>
  <text x="165" y="426" fill="#ffb4ab" font-size="11" font-weight="600" text-anchor="middle">IQ2_K &#10007;</text>

  <rect x="210" y="410" width="76" height="24" rx="12" fill="#12021f" stroke="#ff7a6e" stroke-opacity="0.55"/>
  <text x="248" y="426" fill="#ffb4ab" font-size="11" font-weight="600" text-anchor="middle">IQ2_KT &#10007;</text>

  <rect x="296" y="410" width="104" height="24" rx="12" fill="#12021f" stroke="#ff7a6e" stroke-opacity="0.55"/>
  <text x="348" y="426" fill="#ffb4ab" font-size="11" font-weight="600" text-anchor="middle">NO IMATRIX &#10007;</text>

  <rect x="410" y="410" width="108" height="24" rx="12" fill="#12021f" stroke="#7ee2a8" stroke-opacity="0.75"/>
  <text x="464" y="426" fill="#a9f0c8" font-size="11" font-weight="700" text-anchor="middle">1B CONTROL &#10003;</text>

  <text x="532" y="426" fill="#b9a7b7" font-size="11.5">&#8594; requant path isolated; baseline kept</text>
</svg>
