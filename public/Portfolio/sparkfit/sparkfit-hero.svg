<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12021f"/>
      <stop offset="1" stop-color="#2a0648"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcbf88"/>
      <stop offset="1" stop-color="#b08c4e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cba4ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#cba4ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="plate"><rect width="720" height="440" rx="14"/></clipPath>
  </defs>

  <rect width="720" height="440" rx="14" fill="url(#bg)"/>
  <rect x="0" y="0" width="6" height="440" fill="url(#rail)" clip-path="url(#plate)"/>

  <!-- soft glow anchoring the headline stat -->
  <ellipse cx="150" cy="296" rx="180" ry="120" fill="url(#glow)"/>

  <!-- header -->
  <text x="44" y="60" fill="#c8ac72" font-size="12.5" font-weight="700" letter-spacing="2.4">SELF-HOSTED LLM · CUSTOM QUANTIZATION</text>
  <text x="42" y="106" fill="#fdf6ea" font-size="34" font-weight="700" font-family="Georgia,'Times New Roman',ui-serif,serif">Quantizing a 397B MoE</text>
  <text x="42" y="144" fill="#fdf6ea" font-size="34" font-weight="700" font-family="Georgia,'Times New Roman',ui-serif,serif">Into a 121 GiB Budget</text>
  <text x="44" y="174" fill="#a493a2" font-size="14" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">SPARKFIT-v2 · served baseline, one recipe line changed · DGX Spark GB10</text>

  <!-- divider: faint full rule with a bright gold lead-in -->
  <rect x="44" y="196" width="632" height="1" fill="#c9a96e" opacity="0.18"/>
  <rect x="44" y="195" width="32" height="2" fill="#c9a96e" opacity="0.9"/>

  <!-- LEFT: headline readout -->
  <text x="45" y="232" fill="#c8ac72" font-size="11.5" font-weight="700" letter-spacing="2">PREDICTED VS BUILT</text>
  <text x="41" y="312" fill="#cba4ff" font-size="70" font-weight="800" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">0.24%</text>
  <text x="45" y="344" fill="#f4ead9" font-size="17" font-weight="600">106.83 &#8594; 106.6 GB</text>
  <text x="45" y="368" fill="#b9a7b7" font-size="13">file size, priced on paper before any compute</text>

  <!-- RIGHT: gate-ladder panel -->
  <rect x="398" y="214" width="282" height="176" rx="10" fill="#1b0733" stroke="#c9a96e" stroke-opacity="0.16"/>
  <text x="414" y="237" fill="#c8ac72" font-size="10.5" font-weight="700" letter-spacing="1.2">GATE LADDER · CHEAP &#8594; EXPENSIVE</text>

  <!-- ladder rows: G0-G2 passed, G3-G5 running -->
  <circle cx="422" cy="256" r="4" fill="#8fd6a8"/>
  <text x="434" y="260" fill="#f4ead9" font-size="11" font-weight="600">G0 preflight</text>
  <text x="666" y="260" fill="#8fd6a8" font-size="10" font-weight="700" text-anchor="end">PASS</text>

  <circle cx="422" cy="278" r="4" fill="#8fd6a8"/>
  <text x="434" y="282" fill="#f4ead9" font-size="11" font-weight="600">G1 compat + imatrix coverage</text>
  <text x="666" y="282" fill="#8fd6a8" font-size="10" font-weight="700" text-anchor="end">PASS</text>

  <circle cx="422" cy="300" r="5.5" fill="#cba4ff" opacity="0.25"/>
  <circle cx="422" cy="300" r="4" fill="#cba4ff"/>
  <text x="434" y="304" fill="#efe6ff" font-size="11" font-weight="700">G2 size &#177;3%</text>
  <text x="666" y="304" fill="#cba4ff" font-size="10" font-weight="700" text-anchor="end">106.6 / 106.8</text>

  <circle cx="422" cy="322" r="4" fill="none" stroke="#c8ac72" stroke-width="1.5"/>
  <text x="434" y="326" fill="#c3b0c1" font-size="11">G3 perplexity, pinned corpus</text>
  <text x="666" y="326" fill="#c8ac72" font-size="10" font-weight="700" text-anchor="end">RUNNING</text>

  <circle cx="422" cy="344" r="4" fill="none" stroke="#8d7f88" stroke-width="1.5"/>
  <text x="434" y="348" fill="#a493a2" font-size="11">G4 memory at paired config</text>
  <text x="666" y="348" fill="#8d7f88" font-size="10" font-weight="700" text-anchor="end">NEXT</text>

  <circle cx="422" cy="366" r="4" fill="none" stroke="#8d7f88" stroke-width="1.5"/>
  <text x="434" y="370" fill="#a493a2" font-size="11">G5 frozen-suite A/B</text>
  <text x="666" y="370" fill="#8d7f88" font-size="10" font-weight="700" text-anchor="end">NEXT</text>

  <!-- footer -->
  <text x="44" y="420" fill="#8d7f88" font-size="12.5" letter-spacing="0.3">size = &#931; params &#215; bpw / 8 · abort criteria written before the run · 37 min on 16 ARM threads</text>
</svg>
