<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12021f"/>
      <stop offset="1" stop-color="#2a0648"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcbf88"/>
      <stop offset="1" stop-color="#b08c4e"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cba4ff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#cba4ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#cba4ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#cba4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="720" height="440" fill="url(#bg)"/>
  <rect width="720" height="440" fill="url(#glow)"/>

  <!-- header -->
  <text x="32" y="40" fill="#dcbf88" font-size="21" font-weight="700" letter-spacing="1.5">INFERENCE MONITORING</text>
  <text x="33" y="60" fill="#9a7fb0" font-size="12.5">Ornith-397B · DGX Spark GB10 · Prometheus + Grafana</text>
  <g transform="translate(556,30)">
    <rect x="0" y="-16" width="132" height="26" rx="13" fill="#0e2a1c" stroke="#35d07f" stroke-opacity="0.5"/>
    <circle cx="18" cy="-3" r="4.5" fill="#35d07f"/>
    <text x="30" y="1" fill="#7ee7b0" font-size="12.5" font-weight="600">llama · UP</text>
  </g>

  <!-- decode tok/s timeseries panel -->
  <g transform="translate(32,84)">
    <rect width="420" height="242" rx="10" fill="#1b0733" stroke="#3d1b5e"/>
    <text x="16" y="26" fill="#c9b6e6" font-size="13" font-weight="600">decode tok/s</text>
    <text x="404" y="26" text-anchor="end" fill="#cba4ff" font-size="20" font-weight="700">26.9</text>
    <!-- axis rail -->
    <line x1="40" y1="42" x2="40" y2="206" stroke="url(#rail)" stroke-width="2"/>
    <line x1="40" y1="206" x2="400" y2="206" stroke="#4a2770" stroke-width="1.5"/>
    <!-- gridlines -->
    <line x1="40" y1="90" x2="400" y2="90" stroke="#33184f" stroke-width="1"/>
    <line x1="40" y1="148" x2="400" y2="148" stroke="#33184f" stroke-width="1"/>
    <text x="34" y="46" text-anchor="end" fill="#7d63a0" font-size="10">30</text>
    <text x="34" y="152" text-anchor="end" fill="#7d63a0" font-size="10">15</text>
    <text x="34" y="210" text-anchor="end" fill="#7d63a0" font-size="10">0</text>
    <!-- area + line: warmup then steady ~27 with speculative-decode ripple -->
    <path d="M40,198 L70,150 L100,120 L130,108 L160,96 L190,102 L220,88 L250,94 L280,84 L310,90 L340,82 L370,86 L400,80 L400,206 L40,206 Z" fill="url(#area)"/>
    <path d="M40,198 L70,150 L100,120 L130,108 L160,96 L190,102 L220,88 L250,94 L280,84 L310,90 L340,82 L370,86 L400,80" fill="none" stroke="#cba4ff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="400" cy="80" r="3.5" fill="#f2e9ff"/>
    <text x="16" y="232" fill="#7d63a0" font-size="10">rate(llamacpp:tokens_predicted_total[2m]) · capture :8080</text>
  </g>

  <!-- KV gauge panel -->
  <g transform="translate(476,84)">
    <rect width="212" height="112" rx="10" fill="#1b0733" stroke="#3d1b5e"/>
    <text x="16" y="26" fill="#c9b6e6" font-size="13" font-weight="600">KV cache %</text>
    <!-- gauge track with amber/red bands -->
    <path d="M40,92 A66,66 0 0 1 172,92" fill="none" stroke="#33184f" stroke-width="10" stroke-linecap="round"/>
    <path d="M133,41 A66,66 0 0 1 163,66" fill="none" stroke="#e0a53a" stroke-width="10" stroke-linecap="round"/>
    <path d="M163,66 A66,66 0 0 1 172,92" fill="none" stroke="#ff6b6b" stroke-width="10" stroke-linecap="round"/>
    <!-- needle near zero (low = healthy headroom) -->
    <line x1="106" y1="92" x2="46" y2="86" stroke="#f2e9ff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="106" cy="92" r="4" fill="#f2e9ff"/>
    <text x="106" y="80" text-anchor="middle" fill="#7ee7b0" font-size="17" font-weight="700">0.06%</text>
    <text x="150" y="108" text-anchor="end" fill="#7d63a0" font-size="9.5">amber 80 · red 90</text>
  </g>

  <!-- unified-memory 10x panel: the OS-invisible allocation -->
  <g transform="translate(476,216)">
    <rect width="212" height="110" rx="10" fill="#1b0733" stroke="#3d1b5e"/>
    <text x="16" y="26" fill="#c9b6e6" font-size="13" font-weight="600">unified memory</text>
    <text x="196" y="25" text-anchor="end" fill="#dcbf88" font-size="15" font-weight="700">10×</text>
    <!-- GPU-side bar (the real footprint) -->
    <text x="16" y="52" fill="#9a7fb0" font-size="10.5">GPU-side</text>
    <rect x="72" y="43" width="124" height="12" rx="3" fill="url(#rail)"/>
    <text x="70" y="52" text-anchor="end" fill="#e7d3a6" font-size="10">98.8 GiB</text>
    <!-- host RSS bar (what btop sees) -->
    <text x="16" y="78" fill="#9a7fb0" font-size="10.5">host RSS</text>
    <rect x="72" y="69" width="12" height="12" rx="3" fill="#5b3d80"/>
    <text x="90" y="78" fill="#8f74b5" font-size="10">9.2 GiB, all btop sees</text>
    <text x="16" y="99" fill="#7d63a0" font-size="9.5">nvidia-smi --query-compute-apps</text>
  </g>

  <!-- alert rules strip -->
  <g transform="translate(32,346)">
    <text x="0" y="14" fill="#7d63a0" font-size="11" font-weight="600">alerts</text>
    <g font-size="10.5" fill="#8fb9a4">
      <circle cx="52" cy="10" r="3.5" fill="#35d07f"/><text x="61" y="14">ServerDown</text>
      <circle cx="150" cy="10" r="3.5" fill="#35d07f"/><text x="159" y="14">MemLow</text>
      <circle cx="228" cy="10" r="3.5" fill="#35d07f"/><text x="237" y="14">KvSaturated</text>
      <circle cx="336" cy="10" r="3.5" fill="#35d07f"/><text x="345" y="14">Queued</text>
      <circle cx="420" cy="10" r="3.5" fill="#35d07f"/><text x="429" y="14">Stalled</text>
      <circle cx="512" cy="10" r="3.5" fill="#35d07f"/><text x="521" y="14">SwapHigh</text>
    </g>
    <text x="0" y="42" fill="#5f4a7d" font-size="10">6 rules · incident-tuned for: durations · 90d retention</text>
  </g>
</svg>
